name: termbox_test
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  termbox_test_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run:                        make clean test
      - run: CFLAGS='-UTB_LIB_OPTS' make clean test # non-egc, non-truecolor
